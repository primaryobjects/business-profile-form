<div style="display: flex; justify-content: center; width: 100vw; margin: 40px 0; padding: 0;">
  <form style="width: 100%; max-width: 800px; min-width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 32px; margin: 0 2vw;">
    <h2 style="text-align:center; margin-bottom: 8px;">Business User Profile</h2>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Business Name</mat-label>
      <input matInput id="businessName" name="businessName" type="text" required />
    </mat-form-field>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Contact Name</mat-label>
      <input matInput id="contactName" name="contactName" type="text" required />
    </mat-form-field>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Email</mat-label>
      <input matInput id="email" name="email" type="email" required />
    </mat-form-field>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Phone Number</mat-label>
      <input matInput id="phone" name="phone" type="tel" />
    </mat-form-field>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Industry</mat-label>
      <input matInput id="industry" name="industry" type="text" />
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit" style="margin-top: 16px; width: 100%;">Submit</button>
  </form>
</div>
