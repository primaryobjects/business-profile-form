<form class="app-business-profile-form" autocomplete="off">
    <h2>Business User Profile</h2>
    <mat-form-field appearance="outline">
      <mat-label>Business Name</mat-label>
      <input
        matInput
        id="businessName"
        name="businessName"
        type="text"
        required
        minlength="4"
        maxlength="40"
        #businessNameInput="ngModel"
        [(ngModel)]="businessName"
      />
      <mat-error *ngIf="businessNameInput.errors?.['required']">
        Business Name is required
      </mat-error>
      <mat-error *ngIf="businessNameInput.errors?.['minlength']">
        Business Name must be at least 4 characters
      </mat-error>
      <mat-error *ngIf="businessNameInput.errors?.['maxlength']">
        Business Name cannot exceed 40 characters
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Contact Name</mat-label>
      <input matInput id="contactName" name="contactName" type="text" required />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput id="email" name="email" type="email" required />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input matInput id="phone" name="phone" type="tel" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Industry</mat-label>
      <input matInput id="industry" name="industry" type="text" />
    </mat-form-field>

    <!-- Dropdown -->
    <mat-form-field appearance="outline">
      <mat-label>Business Size</mat-label>
      <mat-select name="businessSize" required>
        <mat-option value="small">Small (1-10)</mat-option>
        <mat-option value="medium">Medium (11-100)</mat-option>
        <mat-option value="large">Large (100+)</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Radio Buttons -->
    <label>Preferred Contact Method</label>
    <mat-radio-group name="contactMethod" class="checkbox-group">
      <mat-radio-button value="email">Email</mat-radio-button>
      <mat-radio-button value="phone">Phone</mat-radio-button>
      <mat-radio-button value="none">No Preference</mat-radio-button>
    </mat-radio-group>

    <!-- Checkboxes -->
    <label>Services Interested In</label>
    <div class="checkbox-group">
      <mat-checkbox name="services" value="consulting">Consulting</mat-checkbox>
      <mat-checkbox name="services" value="support">Support</mat-checkbox>
      <mat-checkbox name="services" value="training">Training</mat-checkbox>
    </div>

    <button mat-raised-button color="primary" type="submit" style="margin-top: 16px;">Submit</button>
  </form>
